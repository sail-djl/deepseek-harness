# DeepSeekHarness 项目上下文（项目本身）
# 生成时间: 2026-10-14
# 格式版本: 2.0

# ==================== 项目概述 ====================
project:
  name: "DeepSeek Harness (dsh)"
  package_name: "@deepseek-ai/dsh-root"
  description: "开源 Agent 框架，基于 Cordis 微内核的插件化 AI Agent 运行环境"
  version: "0.1.1-rc.2"
  license: "MIT"
  stage: "开发者预览版"

# ==================== 技术栈 ====================
tech_stack:
  language: "TypeScript 6.0+ (ESM)"
  runtime: "Node.js ^22.19.0 或 >=24.0.0"
  package_manager: "pnpm 11.7.0 (workspaces)"
  build_tools: "tsc + tsdown + Vite"
  test_framework: "Vitest 4.1.8"
  linter: "oxlint 1.76.0"
  microkernel: "Cordis (vendor/cordis)"

# ==================== 项目结构 ====================
structure:
  app_entry:
    cli: "apps/cli/ — dsh 命令行入口"
    web: "apps/web/ — Web UI 前端"
  core_packages:
    - "core/ — Agent, Session, Tools, Scope"
    - "llm/ — LLM 适配器"
    - "fs/ — 文件系统工具"
    - "shell/ — Shell 执行"
    - "terminal/ — 终端"
    - "sandbox/ — 沙箱"
    - "session/ — 会话管理"
    - "client/ — 客户端运行时"
    - "web/ — Web 服务"
    - "sdk/ — SDK"
    - "boot/ — 启动引导"
    - "bundle/ — 分发包"
    - "settings/ — 设置"
    - "credentials/ — 凭证管理"
    - "lsp/ — 语言服务器"
    - "plan/ — 计划模式"
    - "goal/ — 目标管理"
    - "workflow/ — 工作流"
    - "subagent/ — 子代理"
  vendor:
    - "cordis/ — 插件化微内核"
    - "cosmokit/ — 工具库"
    - "group/ — 分组"
    - "hmr/ — 热更新"
    - "loader/ — 加载器"
  apps:
    - "apps/cli/ — CLI 入口"
    - "apps/web/ — Web UI (Vite + React)"
    - "examples/ — 示例项目"
    - "website/ — 文档网站"

# ==================== 核心配置 ====================
key_files:
  tsconfig_root: "tsconfig.json"
  tsconfig_host: "tsconfig.host.json — Host 聚合 (服务端)"
  tsconfig_client: "tsconfig.client.json — Client 聚合 (客户端)"
  tsconfig_base: "tsconfig.base.json — 共享编译选项"
  plugin_config: "cordis.patch.yml — 插件配置（patch 替换整行，非深度合并）"

# ==================== 注意事项 ====================
notes:
  - "项目处于开发者预览阶段，存在不兼容变更"
  - "Host/Client 双聚合架构，新增包只能注册到其中一个"
  - "插件配置通过 cordis.patch.yml 管理，patch 替换整行配置（非深度合并）"
  - "Windows 下 landlock-run 相关包不支持（Linux 专用）"
