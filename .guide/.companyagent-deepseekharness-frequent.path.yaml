# DeepSeekHarness 常用信息（账号/命令/服务）
# 生成时间: 2026-10-14
# 格式版本: 2.0

# ==================== 账号信息 ====================
accounts:
  deepseek_api:
    api_key: "(待填写)"
    platform_url: "https://platform.deepseek.com/api_keys"

# ==================== 环境变量 ====================
environment:
  DEEPSEEK_API_KEY: "DeepSeek API 密钥 (必填)"
  DEEPSEEK_BASE_URL: "自定义 API 地址 (可选)"

# ==================== 本地服务 ====================
services:
  web_ui: "http://127.0.0.1:3080"

# ==================== 常用命令 ====================
commands:
  build: "pnpm run build"
  build_web: "pnpm run build:web"
  typecheck: "pnpm run typecheck"
  test: "pnpm run test"

# ==================== Git 仓库 ====================
git:
  remote: "https://github.com/deepseek-ai/deepseek-harness"
  branch: "master"
