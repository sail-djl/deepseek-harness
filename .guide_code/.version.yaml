# ============================================================
# .version.yaml — 上游 master 与 本分支 同步状态标记
#
# 仓库：dsharnesscode（deepseek-harness 的 code 分支工作副本，`.guide_code/` 专属目录）
# 用途：一眼看清「本分支相对上游 master 落后/领先多少、版本号是否对齐」
# 维护：任何同步 / 升级操作后更新本文件；流程见
#       win-dsh-package-sec/scenes/DeepSeek Harness 版本维护.md（阶段 0 巡检 → 阶段 2 同步）
# 版本明细：见 guide 仓库 .guide/.version/（每个版本一个 md，索引 0 索引.md）
# 对照文件：dsharnessguide\.guide\.version.yaml 与 本仓库 .guide/.version.yaml（同格式，2026-10-20 对齐）
# ============================================================

checked_at: "2026-10-20"        # 本文件数据采集时间

# ---------- 仓库 ----------
