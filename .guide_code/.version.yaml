# ---------- 本分支（当前检出） ----------
branch:
  name: master_code
  commit: 01812a8412
  version: 0.2.1-alpha.5
  tracks: none              # master_code 未设置上游跟踪

# ---------- 同步状态 ----------
# status 取值：
#   synced      落后 0 / 领先 0   —— 与上游完全一致
#   local-ahead 落后 0 / 领先 >0  —— 上游内容已全部包含，本地另有独有提交
#   behind      落后 >0 / 领先 0   —— 需快进同步（见场景阶段 0）
#   diverged    落后 >0 / 领先 >0  —— 双向分叉，须人工确认后再合并
sync:
  status: local-ahead
  behind: 0                 # 本分支落后上游 master 的提交数
  ahead: 10                 # 本分支领先上游 master 的提交数（原 7 + code预设 + agent-teams + 本 guide 提交）
  version_aligned: true     # 0.2.1-alpha.5 = 上游 0.2.1-alpha.5

# ---------- 本地分支总览 ----------
local_branches:
  - name: master_code
    commit: 01812a8412
    version: 0.2.1-alpha.5
    status: local-ahead
    behind: 0
    ahead: 10
  - name: master
    commit: 1517a4dbca
    version: 0.2.1-alpha.5
    tracks: upstream/master
    status: synced
    behind: 0
    ahead: 0

# ---------- 同步历史 ----------
sync_log:
  - date: "2026-10-17"
    action: "master 快进同步到 0.2.1-alpha.5"
    from: d743267388
    to: 1517a4dbca
    behind_before: 977
  - date: "2026-10-12"
    action: "code 快进同步到 0.2.1-alpha.2"
    from: 5badb15009
    to: d743267388
    behind_before: 669

